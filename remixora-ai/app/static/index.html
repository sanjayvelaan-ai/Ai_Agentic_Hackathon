<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090B10">
  <title>REMIXORA · AI Studio</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  
  <!-- Centralized Design System Architecture: Liquid Chrome × Obsidian × Pearl Lavender -->
  <link rel="stylesheet" href="/static/tokens.css?v=4">
  <link rel="stylesheet" href="/static/liquid-button.css?v=4">
  <link rel="stylesheet" href="/static/redesign.css?v=4">
  <link rel="stylesheet" href="/static/workflow.css?v=4">

  <!-- Core Scripts -->
  <script src="/static/theme.js?v=4"></script>
  <script src="/static/liquid-button.js?v=4" defer></script>
  <script src="/static/smart.js?v=4" defer></script>
  <script src="/static/workflow.js?v=4" defer></script>
  <script src="/static/projects.js?v=4" defer></script>
  <script src="/static/remix.js?v=4" defer></script>
  <script src="/static/showcase.js?v=4" defer></script>
  <script src="/static/app.js?v=4" defer></script>
  <script src="/static/product.js?v=4" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Redesigned AppShell Sidebar -->
  <aside class="sidebar" id="sidebar">
    <a class="wordmark" href="#projects">
      <img src="/static/mark.svg" alt="REMIXORA" width="34" height="34">
      <span>remixora<span class="purple">.</span></span>
    </a>
    <nav aria-label="Main navigation" id="navigation"></nav>
    <div class="sidebar-bottom">
      <div class="sidebar-status">
        <span class="status-dot"></span>
        <span>Studio Engine Active</span>
      </div>
    </div>
  </aside>

  <!-- AppShell Main Area -->
  <div class="app-shell">
    <header class="topbar">
      <div class="breadcrumb">
        <button class="icon-button mobile-menu" id="menu" aria-label="Toggle navigation">☰</button>
        <span>Workspace</span>
        <span class="slash">/</span>
        <strong id="breadcrumb">My Projects</strong>
      </div>
      <div class="topbar-right">
        <!-- 3-Way Theme Switcher (Dark / Light / System) -->
        <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Color theme">
          <button type="button" data-theme-btn="dark" title="Dark theme (Obsidian)">🌙</button>
          <button type="button" data-theme-btn="light" title="Light theme (Pearl Lavender)">☀️</button>
          <button type="button" data-theme-btn="system" title="System preference">💻</button>
        </div>
        <a class="btn btn-primary btn-sm" href="#ingest" data-action="new-workflow">Import source</a>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <footer class="footer">
      <span>REMIXORA AI Studio · Agentic Media Repurposing</span>
      <span>Liquid Chrome × Obsidian × Pearl Lavender</span>
    </footer>
  </div>

  <!-- Shared Notification Toast & Modal Dialog -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button id="dialog-close" class="icon-button" aria-label="Close dialog">✕</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
