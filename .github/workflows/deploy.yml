name: Remixora CI/CD & Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suite & Validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Validate Syntax & Static Assets
        run: |
          python -m compileall -q remixora-ai/app
          node --check remixora-ai/app/static/app.js
          node --check remixora-ai/app/static/projects.js
          node --check remixora-ai/app/static/smart.js
          node --check remixora-ai/app/static/workflow.js

      - name: Run Pytest
        working-directory: remixora-ai
        env:
          DATA_DIR: /tmp/remixora-ci-data
          AI_PROVIDER: none
          TRANSCRIPTION_BACKEND: none
        run: |
          python -m pytest tests/test_ai.py tests/test_media.py -v

  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Vercel Token Configuration
        id: check_token
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::VERCEL_TOKEN secret is not set. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to GitHub repo secrets to enable automatic production deployment."
          fi

      - name: Install Vercel CLI
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_token.outputs.has_token == 'true'
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts
        if: steps.check_token.outputs.has_token == 'true'
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel
        if: steps.check_token.outputs.has_token == 'true'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
